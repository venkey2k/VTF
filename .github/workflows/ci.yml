name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system compression libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev libzstd-dev

    - name: Install system compression libraries (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install lz4 zstd || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install numpy pyarrow pytest

    - name: Build and install package
      run: |
        pip install -v .

    - name: Run Quickstart Verification
      run: |
        python example_quickstart.py

    - name: Run Benchmarks and Integrity Verification
      run: |
        python benchmark_vtf.py
