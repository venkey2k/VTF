name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system compression libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y liblz4-dev libzstd-dev

    - name: Install system compression libraries (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install lz4 zstd || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install numpy pyarrow pytest

    - name: Build and install package
      run: |
        pip install -v .

    - name: Run Quickstart Verification
      run: |
        python example_quickstart.py

    - name: Verify sdist builds from source
      if: runner.os == 'Linux' && matrix.python-version == '3.13'
      run: |
        python -m pip install build
        python -m build --sdist
        python -m venv /tmp/vtf-sdist-venv
        /tmp/vtf-sdist-venv/bin/pip install --no-cache-dir dist/*.tar.gz
        /tmp/vtf-sdist-venv/bin/python -c "import vtf; print('sdist itemsize:', vtf.VTF_TICK_DTYPE.itemsize)"

    - name: Run Benchmarks and Integrity Verification
      run: |
        python benchmark_vtf.py
