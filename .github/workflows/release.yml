name: Build Wheels & Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      if: runner.os == 'Linux'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Build wheels via cibuildwheel
      uses: pypa/cibuildwheel@v2.22.0
      env:
        CIBW_ARCHS_LINUX: auto aarch64
        CIBW_ARCHS_MACOS: auto
        CIBW_ARCHS_WINDOWS: auto
        # Install system compression libs inside Linux containers
        CIBW_BEFORE_ALL_LINUX: >
          yum install -y lz4-devel libzstd-devel 2>/dev/null ||
          apk add --no-cache lz4-dev zstd-dev 2>/dev/null ||
          apt-get update && apt-get install -y liblz4-dev libzstd-dev 2>/dev/null || true
        # Install Homebrew libs on macOS runners
        CIBW_BEFORE_ALL_MACOS: brew install lz4 zstd || true
        # Pass NOMINMAX + CRT flags to MSVC on Windows
        CIBW_ENVIRONMENT_WINDOWS: >
          CL="/DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_CRT_SECURE_NO_WARNINGS"
        # Skip PyPy and very old 32-bit Windows builds (no MSVC 32-bit in runners)
        CIBW_SKIP: "pp* cp38-win32 cp39-win32"
        # Verbose output to diagnose any remaining failures
        CIBW_BUILD_VERBOSITY: "1"

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build
      run: python -m pip install --upgrade pip build

    - name: Build sdist
      run: python -m build --sdist

    - uses: actions/upload-artifact@v4
      with:
        name: cibw-sdist
        path: dist/*.tar.gz

  publish_to_pypi:
    name: Publish distribution to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nuro-vtf
    permissions:
      id-token: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        skip-existing: true
