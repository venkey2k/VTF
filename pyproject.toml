[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuro-vtf"
version = "1.0.5"

description = "VTF (Venkey Tick Format) v1.0 — High-Frequency Option Market Data Format & Zero-Copy Engine"
readme = "README.md"
license = "MIT"
authors = [
    { name = "venkey2k", email = "venkey2kkid@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20"
]
keywords = [
    "hft",
    "market-data",
    "options",
    "nifty",
    "sensex",
    "orderbook",
    "greeks",
    "binary-format",
    "lz4",
    "simd",
    "zero-copy",
    "vtf"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/venkey2k/VTF"
Repository = "https://github.com/venkey2k/VTF.git"
Issues = "https://github.com/venkey2k/VTF/issues"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* pp* *_i686 *_win32"
manylinux-x86_64-image = "manylinux_2_28"
test-requires = "numpy"
test-command = "python -c \"import vtf; print('VTF itemsize:', vtf.VTF_TICK_DTYPE.itemsize)\""


